server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve the .gz files produced at build time; compress anything else on the fly
    gzip_static on;
    gzip on;
    gzip_types application/javascript application/wasm application/octet-stream image/svg+xml;

    types {
        text/html html;
        application/javascript js;
        application/wasm wasm;
        application/octet-stream data;
        image/svg+xml svg;
    }

    # File names are not versioned, so let browsers revalidate with the ETag
    add_header Cache-Control "no-cache" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
